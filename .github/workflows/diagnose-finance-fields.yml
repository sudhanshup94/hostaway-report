name: Diagnostic - Finance Fields

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Date to inspect (YYYY-MM-DD). Blank = today IST.'
        required: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Dump finance calculated fields
        env:
          HOSTAWAY_ACCOUNT_ID: ${{ secrets.HOSTAWAY_ACCOUNT_ID }}
          HOSTAWAY_API_KEY: ${{ secrets.HOSTAWAY_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: node diagnose-finance-fields.js
