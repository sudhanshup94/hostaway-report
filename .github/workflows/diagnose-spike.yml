name: Diagnostic - Explain One Day's Occupancy

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Date to explain (YYYY-MM-DD IST)'
        required: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - env:
          HOSTAWAY_ACCOUNT_ID: ${{ secrets.HOSTAWAY_ACCOUNT_ID }}
          HOSTAWAY_API_KEY: ${{ secrets.HOSTAWAY_API_KEY }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: node diagnose-spike.js
